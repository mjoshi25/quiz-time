spring.application.name=quiz-backend
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.tomcat.max-swallow-size=5MB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=${MONGODB_AUTO_INDEX:true}
app.jwt.secret=${JWT_SECRET:change-this-secret-to-at-least-32-characters-long}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}
app.cors.origin=${FRONTEND_ORIGIN}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=false
